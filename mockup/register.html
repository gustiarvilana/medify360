<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Stitch 360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .auth-container { display: flex; height: 100%; }
        .auth-form { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; animation: slideIn 0.8s ease-out; background: #fff; }
        .auth-visual { flex: 1; background: linear-gradient(135deg, #198754, #20c997); display: flex; align-items: center; justify-content: center; color: white; text-align: center; padding: 40px; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        
        .form-box { width: 100%; max-width: 400px; }
        .form-control { border-radius: 12px; padding: 14px 20px; border: 1px solid #e0e0e0; }
        .btn-primary { padding: 14px; border-radius: 12px; font-weight: 600; background-color: #198754; border-color: #198754; }
        .btn-primary:hover { background-color: #157347; border-color: #146c35; }
        
        @media (max-width: 768px) { .auth-visual { display: none; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-visual">
            <div>
                <h1 class="fw-bold mb-3">Stitch 360</h1>
                <p class="lead">Mulai perjalanan apresiasi budaya perusahaan Anda hari ini.</p>
            </div>
        </div>
        <div class="auth-form">
            <div class="form-box">
                <h2 class="fw-bold mb-2">Buat Akun Baru</h2>
                <p class="text-muted mb-4">Bergabunglah dengan ekosistem positif kami.</p>
                <form action="login.html">
                    <div class="mb-3"><input type="text" class="form-control" placeholder="Nama Lengkap" required></div>
                    <div class="mb-3"><input type="email" class="form-control" placeholder="Email Perusahaan" required></div>
                    <div class="mb-3 position-relative">
                        <input type="password" class="form-control" id="password" placeholder="Kata Sandi" required>
                        <span class="material-symbols-outlined position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer; color:#adb5bd;" onclick="togglePass('password')">visibility</span>
                    </div>
                    <div class="mb-3 position-relative">
                        <input type="password" class="form-control" id="repassword" placeholder="Konfirmasi Kata Sandi" required>
                        <span class="material-symbols-outlined position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer; color:#adb5bd;" onclick="togglePass('repassword')">visibility</span>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Daftar Sekarang</button>
                </form>
                <p class="text-center mt-3 small text-muted">Sudah punya akun? <a href="login.html" class="fw-bold text-success">Masuk</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePass(id) {
            const p = document.getElementById(id);
            p.type = p.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
