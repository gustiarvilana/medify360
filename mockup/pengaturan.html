<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - Stitch 360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        @media (min-width: 992px) {
            .sidebar { position: fixed; top: 56px; bottom: 0; left: 0; z-index: 1000; padding: 0; width: 240px; background-color: #fff; border-right: 1px solid #e0e4e9; height: calc(100vh - 56px); overflow-y: auto; }
            .main-content { margin-left: 240px; padding: 30px; }
        }
        .card { border-radius: 16px; border: none; }
    </style>
</head>
<body>
    <nav id="navbar-placeholder" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top"></nav>
    <div id="sidebar-placeholder" class="sidebar d-none d-lg-block"></div>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar">
        <div class="offcanvas-header bg-dark text-white"><h5 class="offcanvas-title fw-bold">Stitch 360</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
        <div id="mobile-sidebar-placeholder" class="offcanvas-body p-0"></div>
    </div>

    <main class="main-content">
        <div class="container-fluid">
            <h2 class="fw-bold mb-4">Pengaturan Akun</h2>
            <div class="row g-4">
                <div class="col-lg-8">
                    <!-- Tab Menu -->
                    <ul class="nav nav-tabs mb-4 border-0">
                        <li class="nav-item"><button class="nav-link active rounded-pill px-4" data-bs-toggle="tab" data-bs-target="#profil">Profil</button></li>
                        <li class="nav-item"><button class="nav-link rounded-pill px-4" data-bs-toggle="tab" data-bs-target="#notifikasi">Notifikasi</button></li>
                        <li class="nav-item"><button class="nav-link rounded-pill px-4" data-bs-toggle="tab" data-bs-target="#privasi">Privasi & Keamanan</button></li>
                    </ul>

                    <div class="tab-content">
                        <!-- Profil -->
                        <div class="tab-pane fade show active" id="profil">
                            <div class="card shadow-sm p-4">
                                <h5 class="fw-bold mb-4">Informasi Profil</h5>
                                <div class="row g-3">
                                    <div class="col-md-6"><label class="form-label small fw-bold">Nama Lengkap</label><input type="text" class="form-control" value="Budi Santoso"></div>
                                    <div class="col-md-6"><label class="form-label small fw-bold">Email</label><input type="email" class="form-control" value="budi@perusahaan.com"></div>
                                    <div class="col-md-6"><label class="form-label small fw-bold">Departemen</label><input type="text" class="form-control" value="Teknologi Informasi" readonly></div>
                                    <div class="col-md-6"><label class="form-label small fw-bold">Zona Waktu</label><select class="form-select"><option>WIB (GMT+7)</option></select></div>
                                </div>
                                <button class="btn btn-primary mt-4">Simpan Profil</button>
                            </div>
                        </div>

                        <!-- Notifikasi -->
                        <div class="tab-pane fade" id="notifikasi">
                            <div class="card shadow-sm p-4">
                                <h5 class="fw-bold mb-4">Preferensi Notifikasi</h5>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="n1"><label class="form-check-label" for="n1">Terima email saat menerima Cendol</label>
                                </div>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="n2"><label class="form-check-label" for="n2">Notifikasi harian aktivitas tim</label>
                                </div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="n3"><label class="form-check-label" for="n3">Notifikasi suara untuk insiden Bata</label>
                                </div>
                                <button class="btn btn-primary mt-4">Simpan Notifikasi</button>
                            </div>
                        </div>

                        <!-- Privasi -->
                        <div class="tab-pane fade" id="privasi">
                            <div class="card shadow-sm p-4">
                                <h5 class="fw-bold mb-4">Keamanan Akun</h5>
                                <div class="mb-3"><label class="form-label small fw-bold">Kata Sandi Baru</label><input type="password" class="form-control"></div>
                                <div class="mb-3"><label class="form-label small fw-bold">Konfirmasi Kata Sandi</label><input type="password" class="form-control"></div>
                                <button class="btn btn-outline-danger mt-2">Ubah Kata Sandi</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card shadow-sm p-4 text-center">
                        <img src="https://ui-avatars.com/api/?name=Budi+Santoso&size=128&background=random" class="rounded-circle mb-3 mx-auto shadow-sm" width="100">
                        <h5 class="fw-bold">Budi Santoso</h5>
                        <p class="text-muted small">Senior Developer</p>
                        <button class="btn btn-sm btn-outline-primary">Unggah Foto Baru</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
