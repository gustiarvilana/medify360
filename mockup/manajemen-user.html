<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - Stitch 360</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        @media (min-width: 992px) {
            .sidebar { position: fixed; top: 56px; bottom: 0; left: 0; z-index: 1000; padding: 0; width: 240px; background-color: #fff; border-right: 1px solid #e0e4e9; height: calc(100vh - 56px); overflow-y: auto; }
            .main-content { margin-left: 240px; padding: 30px; }
        }
        .table-card { border-radius: 16px; border: none; }
    </style>
</head>
<body>

    <nav id="navbar-placeholder" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top"></nav>
    <div id="sidebar-placeholder" class="sidebar d-none d-lg-block"></div>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar">
        <div class="offcanvas-header bg-dark text-white"><h5 class="offcanvas-title fw-bold">Stitch 360</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
        <div id="mobile-sidebar-placeholder" class="offcanvas-body p-0"></div>
    </div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Manajemen User</h2>
                <button class="btn btn-primary shadow-sm px-4" data-bs-toggle="modal" data-bs-target="#modalUser">
                    <span class="material-symbols-outlined align-middle">add</span> Tambah Karyawan
                </button>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4"><div class="card p-4 border-0 shadow-sm"><h6 class="text-muted small">Total User</h6><h3 class="fw-bold">156</h3></div></div>
                <div class="col-md-4"><div class="card p-4 border-0 shadow-sm"><h6 class="text-muted small">User Aktif</h6><h3 class="fw-bold text-success">142</h3></div></div>
                <div class="col-md-4"><div class="card p-4 border-0 shadow-sm"><h6 class="text-muted small">Admin</h6><h3 class="fw-bold text-primary">5</h3></div></div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light text-muted small">
                                <tr>
                                    <th class="ps-4">Nama</th>
                                    <th>Jabatan</th>
                                    <th>Departemen</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="ps-4"><strong>Budi Santoso</strong><br><small class="text-muted">budi@perusahaan.com</small></td>
                                    <td>Senior Dev</td>
                                    <td>IT</td>
                                    <td><span class="badge bg-success-subtle text-success rounded-pill">Aktif</span></td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#modalUser"><span class="material-symbols-outlined" style="font-size:16px">edit</span></button>
                                        <button class="btn btn-sm btn-outline-danger"><span class="material-symbols-outlined" style="font-size:16px">delete</span></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Tambah/Edit User -->
    <div class="modal fade" id="modalUser" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white"><h5 class="modal-title fw-bold">Data Karyawan</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body p-4">
                    <form>
                        <div class="mb-3"><label class="form-label fw-bold small">Nama Lengkap</label><input type="text" class="form-control" placeholder="Nama lengkap..."></div>
                        <div class="mb-3"><label class="form-label fw-bold small">Email</label><input type="email" class="form-control" placeholder="email@perusahaan.com"></div>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label fw-bold small">Jabatan</label><input type="text" class="form-control"></div>
                            <div class="col-md-6"><label class="form-label fw-bold small">Departemen</label><select class="form-select"><option>IT</option><option>HR</option></select></div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary">Simpan Data</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
