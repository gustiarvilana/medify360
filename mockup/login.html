<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Stitch 360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .auth-container { display: flex; height: 100%; }
        .auth-form { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; animation: slideIn 0.8s ease-out; background: #fff; }
        .auth-visual { flex: 1; background: linear-gradient(135deg, #0d6efd, #0099ff); display: flex; align-items: center; justify-content: center; color: white; text-align: center; padding: 40px; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        
        .form-box { width: 100%; max-width: 400px; }
        .form-control { border-radius: 12px; padding: 14px 20px; border: 1px solid #e0e0e0; }
        .btn-primary { padding: 14px; border-radius: 12px; font-weight: 600; }
        
        @media (max-width: 768px) { .auth-visual { display: none; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <div class="form-box">
                <h2 class="fw-bold mb-2">Selamat Datang Kembali</h2>
                <p class="text-muted mb-4">Masuk ke akun Stitch 360 Anda.</p>
                <form action="index.html">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Username atau Email</label>
                        <input type="text" class="form-control" placeholder="Username atau email" required>
                    </div>
                    <div class="mb-3 position-relative">
                        <label class="form-label small fw-bold text-secondary">Kata Sandi</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        <span class="material-symbols-outlined position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer; color:#adb5bd; margin-top: 10px;" onclick="togglePass('password')">visibility</span>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Masuk</button>
                </form>
                <p class="text-center mt-3 text-muted">Belum punya akun? <a href="register.html" class="fw-bold text-primary">Daftar</a></p>
            </div>
        </div>
        <div class="auth-visual">
            <div>
                <h1 class="fw-bold mb-3">Stitch 360</h1>
                <p class="lead">Platform budaya dan performa kerja terbaik untuk tim modern.</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePass(id) {
            const p = document.getElementById(id);
            p.type = p.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
