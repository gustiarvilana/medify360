<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Stitch 360</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        @media (min-width: 992px) {
            .sidebar { position: fixed; top: 56px; bottom: 0; left: 0; z-index: 1000; padding: 0; width: 240px; background-color: #fff; border-right: 1px solid #e0e4e9; height: calc(100vh - 56px); overflow-y: auto; }
            .main-content { margin-left: 240px; padding: 30px; }
        }
        .top-rank-card { border: none; border-radius: 20px; transition: transform 0.3s; }
        .top-rank-card:hover { transform: scale(1.02); }
        .rank-badge { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
    </style>
</head>
<body>

    <nav id="navbar-placeholder" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top"></nav>
    <div id="sidebar-placeholder" class="sidebar d-none d-lg-block"></div>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar">
        <div class="offcanvas-header bg-dark text-white"><h5 class="offcanvas-title fw-bold">Stitch 360</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
        <div id="mobile-sidebar-placeholder" class="offcanvas-body p-0"></div>
    </div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">🏆 Papan Peringkat Budaya</h2>
                <select class="form-select w-auto"><option>Mingguan</option><option>Bulanan</option></select>
            </div>
            
            <!-- Top 3 -->
            <div class="row g-4 mb-5 justify-content-center align-items-end">
                <div class="col-md-3 order-2 order-md-1">
                    <div class="card top-rank-card shadow-sm p-4 text-center">
                        <img src="https://ui-avatars.com/api/?name=Maya+Sari" class="rounded-circle border border-secondary border-3 mb-3 mx-auto" width="80">
                        <h5 class="fw-bold mb-0">Maya Sari</h5>
                        <p class="text-muted small">Produk • 84 Cendol</p>
                        <span class="badge bg-secondary text-white rounded-pill px-3">Juara 2</span>
                    </div>
                </div>
                <div class="col-md-4 order-1 order-md-2">
                    <div class="card top-rank-card shadow p-5 text-center bg-warning text-white" style="transform: scale(1.05);">
                        <img src="https://ui-avatars.com/api/?name=Dedi+Kusnandar" class="rounded-circle border border-white border-4 mb-3 mx-auto" width="100">
                        <h4 class="fw-bold mb-0">Dedi Kusnandar</h4>
                        <p class="small opacity-90">IT • 102 Cendol</p>
                        <span class="badge bg-dark text-white rounded-pill px-3">Juara 1</span>
                    </div>
                </div>
                <div class="col-md-3 order-3 order-md-3">
                    <div class="card top-rank-card shadow-sm p-4 text-center">
                        <img src="https://ui-avatars.com/api/?name=Rian+Putra" class="rounded-circle border border-warning border-3 mb-3 mx-auto" width="80">
                        <h5 class="fw-bold mb-0">Rian Putra</h5>
                        <p class="text-muted small">Marketing • 76 Cendol</p>
                        <span class="badge bg-warning text-dark rounded-pill px-3">Juara 3</span>
                    </div>
                </div>
            </div>

            <!-- List Peringkat -->
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white py-3 px-4"><h6 class="fw-bold mb-0">Peringkat Lainnya</h6></div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-muted small"><tr><th class="ps-4">Posisi</th><th>Karyawan</th><th>Departemen</th><th class="text-center">Cendol</th><th class="text-center">Tren</th></tr></thead>
                        <tbody>
                            <tr>
                                <td class="ps-4 fw-bold text-muted">#4</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img src="https://ui-avatars.com/api/?name=Siska+Putri" class="rounded-circle me-3" width="32">
                                        <span>Siska Putri</span>
                                    </div>
                                </td>
                                <td>Produk</td>
                                <td class="text-center fw-bold">68</td>
                                <td class="text-center text-success"><span class="material-symbols-outlined">trending_up</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
